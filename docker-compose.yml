services:
  postgres:
    image: postgres:16-alpine
    container_name: cmadms_postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cmadms_db

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cmadms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: cmadms_pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cmadms.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_CONFIG_SERVER_MODE: "False"

    ports:
      - "5051:80"

    depends_on:
      postgres:
        condition: service_healthy

  cmadms_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmadms_app
    restart: always

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/cmadms_db"

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
