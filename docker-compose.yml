services:
  # ============================================================================
  # PostgreSQL 16 Alpine Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cmadms_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-cmadms_db}

    ports:
      - "${POSTGRES_PORT:-5434}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/timetable.sql:/docker-entrypoint-initdb.d/02-timetable.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cmadms_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - cmadms_network

  # ============================================================================
  # CMADMS Application (TanStack Start + Nitro Node Server)
  # ============================================================================
  cmadms_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cmadms:latest
    container_name: cmadms_app
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-cmadms_db}"
      SESSION_SECRET: ${SESSION_SECRET:-production_secure_session_secret_cmadms_2026_at_least_32_chars}
      COLLEGE_EMAIL_DOMAIN: ${COLLEGE_EMAIL_DOMAIN:-college.edu.in}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-CmadmsInitial@2026}
      TEMP_PASSWORD_EXPIRES_HOURS: ${TEMP_PASSWORD_EXPIRES_HOURS:-72}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

    ports:
      - "${APP_PORT:-${PORT:-3000}}:3000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cmadms_network

  # ============================================================================
  # pgAdmin 4 (Optional Developer Tooling — run with --profile tools)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: cmadms_pgadmin
    restart: unless-stopped
    profiles:
      - dev
      - tools

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cmadms.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
      PGADMIN_CONFIG_SERVER_MODE: "False"

    ports:
      - "${PGADMIN_PORT:-5051}:80"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - cmadms_network

volumes:
  postgres_data:
    name: cmadms_postgres_data

networks:
  cmadms_network:
    name: cmadms_network
    driver: bridge
